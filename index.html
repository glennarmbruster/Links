<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<script>try { var t = localStorage.getItem('goobs-links-theme'); if (t === 'light' || t === 'blue' || t === 'halloween') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* fine: follow the phone */ }</script>
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--accent:#2563eb;--accent-soft:#dbe6fd;--bg:#f3f5f9;--soft:#e9edf4;--line:#dde2ea}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--accent:#7aa2ff;--accent-ink:#0b1330;--accent-soft:#18233f;--bg:#0e1116;--card:#171b22;--soft:#1e232c;--line:#283040}}
/* Themes (per device, View button): Auto follows the phone; the rest are picked */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="blue"]{
  --bg:#141b28;--card:#1b2435;--soft:#232e43;--line:#2d3a52;--ink:#e2e8f1;--muted:#97a4ba;
  --accent:#8eaedf;--accent-ink:#0e1626;--accent-soft:#24344f;
  --bad:#f28b82;--bad-soft:#3a1f22;--warn:#e9c27a;--warn-soft:#3a3020;--ok:#8fd4a6;--ok-soft:#1b3326;
  --shadow:none;color-scheme:dark}
:root[data-theme="halloween"]{
  --bg:#140b1c;--card:#22142e;--soft:#2f1d3d;--line:#3a2549;--ink:#f6ecff;--muted:#b9a3c9;
  --accent:#ff7a1a;--accent-ink:#1c1026;--accent-soft:#3d2236;
  --bad:#ff5a5f;--bad-soft:#3d1a24;--warn:#ffb02e;--warn-soft:#3d2a16;--ok:#7ee35a;--ok-soft:#1d3320;
  --shadow:none;color-scheme:dark}
:root[data-theme="halloween"] body{background:radial-gradient(120% 50% at 50% -10%,#3d1f52 0,transparent 60%) no-repeat,var(--bg)}
:root[data-theme="halloween"] .star{color:#ffb02e}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 2px}
.themes [role=button]{border-radius:14px;border:2px solid transparent;background:var(--soft);color:var(--ink);padding:8px 0;font:inherit;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.themes [role=button][aria-pressed="true"]{border-color:var(--accent)}
.themes .sw{width:40px;height:26px;border-radius:8px;border:1px solid rgba(127,127,127,.35);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.themes .sw i{display:block}
.ask-body h3{font-size:15px;margin:14px 0 2px}
/* Halloween decorations: moon, cobweb, drifting bats, pumpkins. Behind everything, no taps, only in that theme. */
.spooky{display:none;position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
:root[data-theme="halloween"] .spooky{display:block}
.spooky .moon{position:absolute;right:-30px;top:calc(env(safe-area-inset-top) + 120px);width:150px;height:150px;opacity:.4}
.spooky .web{position:absolute;left:-6px;top:calc(env(safe-area-inset-top) + 58px);width:130px;height:130px;opacity:.2}
.spooky .bat{position:absolute;left:0;width:46px;height:22px;opacity:.5;animation:batfly 26s linear infinite}
.spooky .bat svg{width:100%;height:100%;animation:flap .35s ease-in-out infinite alternate;transform-origin:50% 55%}
.spooky .b1{top:22%;animation-delay:-4s}.spooky .b2{top:40%;width:32px;height:15px;animation-duration:34s;animation-delay:-19s}
.spooky .b3{top:66%;width:38px;height:18px;animation-duration:30s;animation-delay:-11s}
@keyframes batfly{0%{transform:translate(-60px,0)}25%{transform:translate(25vw,-26px)}50%{transform:translate(50vw,10px)}75%{transform:translate(75vw,-18px)}100%{transform:translate(calc(100vw + 60px),0)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
.spooky .pumpkins{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom);height:70px;opacity:.45}
@media (prefers-reduced-motion:reduce){.spooky .bat,.spooky .bat svg{animation:none}.spooky .b1{left:20%}.spooky .b2{left:70%}.spooky .b3{left:45%}}
body{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.hbtn{min-width:44px;padding:0 10px;font-size:18px}
.search{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding:10px 0 4px}
.search input{border-radius:12px;background:var(--card)}
.ico{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--soft);font-weight:800;color:#fff;font-size:17px;letter-spacing:-.02em}
.ico{position:relative}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#fff;opacity:0}
.ico img.ok{opacity:1}
.ico.emo{background:var(--soft);font-size:24px}
.ico.l3{font-size:13px}.gi .ico.l3{font-size:19px}
.more-btn{align-self:flex-start}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none;min-height:60px}
.lrow:first-child{border-top:0}
.lrow .main{flex:1;min-width:0}
.lrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .host{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#f5b301;font-size:14px;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:14px 8px}
.gi{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:inherit;min-width:0;position:relative}

.gi .ico.emo{font-size:34px}

.edit-tools{display:flex;gap:4px;flex:none}
/* All icons: rearrange by dragging */
.grid.arrange .gi{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;animation:wig .28s ease-in-out infinite alternate}
.grid.arrange .gi:nth-child(2n){animation-delay:-.14s}
.grid.arrange .gi,.grid.arrange img{-webkit-user-drag:none}

.grid.arrange .gi.dragging .ico{box-shadow:0 10px 30px rgba(0,0,0,.3)}
@keyframes wig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.grid.arrange .gi{animation:none}}
.arrange-tip{text-align:center;color:var(--muted);font-size:14px;margin:12px 0 0}
#ask .ask-actions{flex-direction:column;align-items:stretch}

.edit-tools .btn{min-width:36px;padding:0 8px}
.gh{display:flex;align-items:center;gap:6px}
.gh .grow{flex:1}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 10px}
.hint.c{text-align:center}
textarea.big{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.emo-pick{display:flex;flex-wrap:wrap;gap:6px}
.emo-pick button{font-size:22px;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.emo-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.emo-pick button.drawn{padding:4px}.emo-pick button.drawn svg{width:100%;height:100%;display:block}
.ico.drawn{background:none}.ico.drawn svg{width:100%;height:100%;display:block}
/* drawn icons on a colored tile, your own images */

.ico.gly.wt{color:#1f2937;box-shadow:inset 0 0 0 1px var(--line)}
.ico.up{background:#fff}
.ico.none{background:var(--soft);color:var(--muted);font-size:12px;font-weight:700;border:1.5px dashed var(--line)}
.icon-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.icon-row .ico{width:52px;height:52px;border-radius:13px;font-size:30px}
#ipk{height:min(88vh,780px);max-width:560px}#ipk[open]{display:flex;flex-direction:column}
.ipk{display:flex;flex-direction:column;flex:1;min-height:0}
.ipk-top{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}.ipk-top .grow{flex:1;min-width:0;display:flex;flex-direction:column}.ipk-top .muted{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ipk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}

/* Calculator (portrait) */
.calcapp{display:flex;flex-direction:column;min-height:calc(100vh - 104px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:calc(100dvh - 104px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding-top:8px}

<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

/* ---- dialogs ---- */
if (!$('#dlg')) document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg"></dialog><dialog id="ask"></dialog>');
{
  const dlg = $('#dlg'); let down = false;
  dlg.addEventListener('pointerdown', e => { down = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && down) dlg.close(); });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctl = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  } else {
    const t = f.type || 'text';
    const extra = t === 'number' ? ` inputmode="decimal" step="${f.step || 'any'}"` : '';
    ctl = `<input id="${id}" name="${f.name}" type="${t}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}"${extra}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''} autocomplete="${f.autocomplete || 'off'}" autocapitalize="${f.capitalize || (t === 'email' || t === 'password' ? 'none' : 'sentences')}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

/* formDialog: fields -> values. onSubmit(values) may return an error string (keeps dialog open).
   onDelete() may return true to close. extra: [{label, kind, onClick}] extra buttons. */
function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {
  const dlg = $('#dlg');
  const body = grid ? `<div class="${grid}">${fields.map(fieldHTML).join('')}</div>` : fields.map(fieldHTML).join('');
  dlg.innerHTML = `<form class="dlg-form" novalidate>
    <h2>${esc(title)}</h2>${intro ? `<p class="muted">${esc(intro)}</p>` : ''}${body}
    <div class="dlg-err" role="alert"></div>
    <div class="dlg-actions">
      ${onDelete ? `<button type="button" class="btn danger" data-k="del">${esc(deleteLabel)}</button>` : ''}
      ${extra.map((x, i) => `<button type="button" class="btn ${x.kind || ''}" data-x="${i}">${esc(x.label)}</button>`).join('')}
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-k="cancel">Cancel</button>
      <button type="submit" class="btn primary">${esc(submitLabel)}</button>
    </div></form>`;
  const form = $('form', dlg), err = $('.dlg-err', dlg);
  const collect = () => {
    const vals = {};
    for (const f of fields) { const el = form.elements[f.name]; vals[f.name] = f.type === 'checkbox' ? el.checked : el.value; }
    return vals;
  };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const vals = collect();
    for (const f of fields) if (f.required && !String(vals[f.name]).trim()) { err.textContent = `${f.label} is required.`; return; }
    err.textContent = '';
    let msg;
    try { msg = await onSubmit(vals); } catch (ex) { msg = ex.message || 'Something went wrong.'; }
    if (msg) err.textContent = msg; else dlg.close();
  });
  $('[data-k="cancel"]', dlg).onclick = () => dlg.close();

/* ---- backup: optional AES-GCM passphrase encryption (Web Crypto, PBKDF2-SHA256) ---- */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

}

  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}

    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },

}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;
    if (env.encrypted) {
      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');
      if (!(env.iterations >= 1000 && env.iterations <= 2000000) || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string')

      data = await promptDecrypt(env);
      if (data === null) return null;
    } else data = env.data;
    if (!data || typeof data !== 'object') throw new Error('The backup contains no data.');

/* pasted list: "# Group" lines start a group; each other line is "Name | address" (optionally "| emoji"), "Name address" or just an address */
function parseList(text) {
  const out = []; let group = '';
  for (const raw of str(text).split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const gm = line.match(/^#+\s*(.+)$/); if (gm) { group = gm[1].trim().slice(0, 40); continue; }
    let name = '', addr = '', emoji = '';
    if (line.includes('|')) { const p = line.split('|').map(x => x.trim()); name = p[0]; addr = p[1] || ''; emoji = p[2] || ''; }
    else { const m = line.match(/^(.*?)\s*((?:https?:\/\/)?[^\s]+\.[^\s]+|https?:\/\/[^\s]+)$/i); if (m) { name = m[1].trim(); addr = m[2]; } else addr = line; }
    const url = linkUrl(addr); if (url) out.push({ name: name.slice(0, 60), url, group, emoji: emoji.slice(0, 16) });

async function tvLoadDate(d, force) {

  let tv, web;
  try { [tv, web] = await Promise.all([tvFetchJSON(`${TVM}/schedule?country=US&date=${d}`), tvFetchJSON(`${TVM}/schedule/web?date=${d}`)]); }
  catch (e) { if (hit) { console.warn(e); return hit; } throw e; }   // keep showing the saved copy
  const items = tv.map(e => slimEp(e)).concat(web.map(e => slimEp(e)).filter(x => x.web && keepWeb(x)));

}

/* drop listings for days that have passed */
async function tvTidyCache() {

  for (const d of [...tvMem.keys()]) if ('tv:' + d < old) tvMem.delete(d);

    const d = await tvDb(); if (!d) return;
    const tx = d.transaction('kv', 'readwrite'), st = tx.objectStore('kv'), q = st.getAllKeys();

/* followed shows: next and last episode */
async function tvLoadShowInfo(force) {

  const todo = state.tv.follow.filter(f => force || !tvShowInfo[f.id] || Date.now() - tvShowInfo[f.id].at > TV_SHOW_FRESH);
  if (!navigator.onLine) return;

    try {
      const s = await tvFetchJSON(`${TVM}/shows/${f.id}?embed[]=nextepisode&embed[]=previousepisode`), em = s._embedded || {};
      tvShowInfo[f.id] = { at: Date.now(), status: str(s.status), net: str((s.network || s.webChannel || {}).name),

      if (route() === 'tv' && tvUi.my) renderIfSafe();

/* ===================== Calculator: a plain standard calculator (×÷ before +−, like a phone calculator) ===================== */
const calc = { tokens: [], entry: '0', fresh: false, done: false, last: null, expr: '', err: false, op: '' };
const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const tidy = v => (Number.isFinite(v) ? parseFloat(v.toPrecision(12)) : NaN);   /* 0.1 + 0.2 = 0.3, not 0.30000000000000004 */
function calcEval(tokens) {
  const t = tokens.slice();
  for (let i = 1; i < t.length; i += 2) if (t[i] === '*' || t[i] === '/') {   /* × and ÷ first */
    const v = t[i] === '*' ? t[i - 1] * t[i + 1] : t[i - 1] / t[i + 1];
    t.splice(i - 1, 3, tidy(v)); i -= 2;
  }
  let v = t[0];
  for (let i = 1; i < t.length; i += 2) v = tidy(t[i] === '+' ? v + t[i + 1] : v - t[i + 1]);
  return tidy(v);
}
function fmtCalc(v) {
  if (!Number.isFinite(v)) return 'Error';
  const a = Math.abs(v);
  if (a >= 1e15 || (a > 0 && a < 1e-9)) return v.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
  return v.toLocaleString('en-US', { maximumFractionDigits: 10 });
}
/* while typing: commas in the whole part, decimals exactly as typed */
function fmtEntry(s) { const neg = s.startsWith('-'), [w, f] = s.replace('-', '').split('.'); return (neg ? '-' : '') + Number(w || 0).toLocaleString('en-US') + (f !== undefined ? '.' + f : ''); }
const entryVal = () => parseFloat(calc.entry) || 0;
const exprText = toks => toks.map(x => (typeof x === 'number' ? fmtCalc(x) : OPS[x])).join(' ');
function calcReset() { Object.assign(calc, { tokens: [], entry: '0', fresh: false, done: false, last: null, expr: '', err: false, op: '' }); }
function calcPress(k) {
  if (calc.err && k !== 'ac') calcReset();
  if (/^\d$/.test(k)) {
    if (calc.done) calcReset();
    if (calc.fresh) { calc.entry = k; calc.fresh = false; }
    else if (calc.entry.replace(/[-.]/g, '').length >= 15) return;
    else calc.entry = calc.entry === '0' ? k : calc.entry === '-0' ? '-' + k : calc.entry + k;
    calc.op = '';
  } else if (k === '.') {
    if (calc.done) calcReset();
    if (calc.fresh) { calc.entry = '0.'; calc.fresh = false; } else if (!calc.entry.includes('.')) calc.entry += '.';
    calc.op = '';
  } else if (OPS[k]) {
    if (calc.done) { calc.tokens = [entryVal()]; calc.done = false; calc.expr = ''; }
    else if (calc.fresh && calc.tokens.length) calc.tokens.pop();   /* changed your mind about the operator */
    else calc.tokens.push(entryVal());
    const sofar = calcEval(calc.tokens);
    calc.tokens.push(k); calc.fresh = true; calc.op = k;
    calc.entry = String(sofar); if (!Number.isFinite(sofar)) calc.err = true;
  } else if (k === '=') {
    let toks;
    if (calc.done) { if (!calc.last) return; toks = [entryVal(), calc.last[0], calc.last[1]]; }   /* = again repeats the last step */
    else { if (calc.fresh && calc.tokens.length) calc.tokens.pop(); else calc.tokens.push(entryVal()); toks = calc.tokens; if (toks.length < 3) { calc.tokens = []; return; } calc.last = [toks[toks.length - 2], toks[toks.length - 1]]; }
    const v = calcEval(toks);
    calc.expr = exprText(toks) + ' ='; calc.entry = String(v); calc.tokens = []; calc.done = true; calc.fresh = false; calc.op = '';
    if (!Number.isFinite(v)) calc.err = true;
  } else if (k === 'ac') {
    if (!calc.err && (calc.entry !== '0' && !calc.done && !calc.fresh)) calc.entry = '0'; else calcReset();   /* C clears the number, AC clears everything */
  } else if (k === 'back') {
    if (calc.done || calc.fresh) return;
    calc.entry = calc.entry.length > 1 && calc.entry !== '-0' ? calc.entry.slice(0, -1) : '0'; if (calc.entry === '-') calc.entry = '0';
  } else if (k === 'neg') {
    if (calc.fresh) { calc.entry = '-0'; calc.fresh = false; } else calc.entry = calc.entry.startsWith('-') ? calc.entry.slice(1) : '-' + calc.entry;
    if (calc.done) { calc.done = false; calc.expr = ''; }
  } else if (k === '%') {
    /* 200 + 10% = 220; 50 × 10% = 5 */
    const n = entryVal(), ops = calc.tokens, before = ops.length ? calcEval(ops.slice(0, -1)) : 0, plus = ops.length && (ops[ops.length - 1] === '+' || ops[ops.length - 1] === '-');
    calc.entry = String(tidy(plus ? before * n / 100 : n / 100)); calc.fresh = false;
    if (calc.done) { calc.done = false; calc.expr = ''; }
  }
  drawCalc();
}
function renderCalc() {
  const keys = [['ac', 'AC', 'fn'], ['neg', '±', 'fn'], ['%', '%', 'fn'], ['/', '÷', 'op'], ['7'], ['8'], ['9'], ['*', '×', 'op'], ['4'], ['5'], ['6'], ['-', '−', 'op'], ['1'], ['2'], ['3'], ['+', '+', 'op'],
    ['back', '⌫', 'fn'], ['0'], ['.', '.'], ['=', '=', 'eq']];
  view.innerHTML = `<div class="calcapp"><button type="button" class="calcdisp" id="calcDisp" aria-live="polite" aria-label="Result. Tap to copy"><span class="calcexpr" id="calcExpr"></span><span class="calcnum" id="calcNum"></span></button>
    <div class="calckeys">${keys.map(([k, label = k, cls = '']) => `<button type="button" class="ck ${cls}" data-ck="${k}" aria-label="${{ ac: 'Clear', neg: 'Plus or minus', back: 'Delete', '/': 'Divide', '*': 'Times', '-': 'Minus', '+': 'Plus', '=': 'Equals', '.': 'Point', '%': 'Percent' }[k] || k}">${label}</button>`).join('')}</div></div>`;
  drawCalc();
}
function drawCalc() {

  const shown = calc.err ? 'Error' : calc.done || calc.fresh ? fmtCalc(parseFloat(calc.entry)) : fmtEntry(calc.entry);

}
view.addEventListener('click', e => {
  if (route() !== 'calc') return;
  const b = e.target.closest('[data-ck]'); if (b) { calcPress(b.dataset.ck); return; }
  if (e.target.closest('#calcDisp')) {
    const raw = calc.err ? '' : String(parseFloat(calc.entry)); if (!raw) return;
    (navigator.clipboard ? navigator.clipboard.writeText(raw) : Promise.reject()).then(() => toast(`Copied ${fmtCalc(parseFloat(raw))}`), () => {});
  }

/* a keyboard works too (Mac, iPad with a keyboard) */
document.addEventListener('keydown', e => {

  const map = { Enter: '=', '=': '=', Backspace: 'back', Escape: 'ac', Delete: 'ac', x: '*', X: '*', ',': '.' }, k = map[e.key] || e.key;

/* ===================== Icon picker: drawn icons in any tile color, emoji, or your own image =====================
   A link's icon choice syncs: emoji (an emoji, §calc, or §key.color for a drawn icon) and img (your own image, 180×180, as a data: address). */
const TILE_COLORS = ['#2563eb', '#0284c7', '#0d9488', '#16a34a', '#65a30d', '#ca8a04', '#ea580c', '#dc2626', '#db2777', '#9333ea', '#4f46e5', '#475569', '#111827', '#92400e', '#ffffff'];
const TILE_NAMES = ['Blue', 'Sky blue', 'Teal', 'Green', 'Lime', 'Gold', 'Orange', 'Red', 'Pink', 'Purple', 'Indigo', 'Slate', 'Black', 'Brown', 'White'];
const WHITE_TILE = TILE_COLORS.length - 1;
const DRAWN_WORDS = { calc: 'Calculator calculator math' };
const GLYPH = new Map(GLYPHS.map(g => [g[0], g]));
const glyphOf = e => { const m = /^§([a-z0-9]{1,10})\.(\d{1,2})$/.exec(str(e)); return m && GLYPH.has(m[1]) && +m[2] < TILE_COLORS.length ? { key: m[1], c: +m[2] } : null; };
const glyphSVG = key => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH.get(key)[3]}</svg>`;
const glyphTile = g => `<span class="ico gly${g.c === WHITE_TILE ? ' wt' : ''}" style="background-color:${TILE_COLORS[g.c]}" aria-hidden="true">${glyphSVG(g.key)}</span>`;
const IMG_MAX = 120000;
const okImg = v => typeof v === 'string' && v.length <= IMG_MAX && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(v);
/* the tile for a chosen icon, or '' when nothing is chosen (then the site's own icon is used) */
function customTile(emoji, img) {
  if (okImg(img)) return `<span class="ico up" aria-hidden="true"><img class="ok" alt="" src="${img}"></span>`;
  const g = glyphOf(emoji); if (g) return glyphTile(g);
  if (drawnOf(emoji)) return `<span class="ico drawn" aria-hidden="true">${DRAWN[drawnOf(emoji)]}</span>`;
  if (emoji && !/^§/.test(emoji)) return `<span class="ico emo" aria-hidden="true">${esc(emoji)}</span>`;
  return '';
}

/* ---- your own image: shrunk to a 180×180 square (what a 60-point icon needs on a 3× screen) ---- */
const UP_SIZE = 180;
function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file isn’t an image this device can open.')); };
    im.src = url;
  });
}
function squareIcon(im, fit) {
  const c = document.createElement('canvas'); c.width = c.height = UP_SIZE;
  const g = c.getContext('2d'), w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
  if (!g || !w || !h) throw new Error('Couldn’t read that image.');
  g.imageSmoothingQuality = 'high';
  if (fit === 'fit') {   /* the whole picture, centered, with a little room around it */
    const k = (UP_SIZE * 0.86) / Math.max(w, h), dw = w * k, dh = h * k;
    g.drawImage(im, (UP_SIZE - dw) / 2, (UP_SIZE - dh) / 2, dw, dh);
  } else {               /* fill the square, cropping the edges of a wide or tall picture */
    const s = Math.min(w, h);
    g.drawImage(im, (w - s) / 2, (h - s) / 2, s, s, 0, 0, UP_SIZE, UP_SIZE);
  }
  let d = c.toDataURL('image/png');
  if (d.length > 60000) {   /* a photo: JPEG is far smaller (on white, since JPEG has no see-through parts) */
    const j = document.createElement('canvas'); j.width = j.height = UP_SIZE;
    const jg = j.getContext('2d'); jg.fillStyle = '#fff'; jg.fillRect(0, 0, UP_SIZE, UP_SIZE); jg.drawImage(c, 0, 0);
    d = j.toDataURL('image/jpeg', 0.85);
  }
  if (!okImg(d)) throw new Error('Couldn’t make an icon from that image.');
  return d;
}

/* ---- the picker ---- */
if (!$('#ipk')) document.body.insertAdjacentHTML('beforeend', '<dialog id="ipk" aria-label="Choose an icon"></dialog>');
const ipk = { tab: 'icons', color: 0, q: '', sel: { emoji: '', img: '' }, src: null, fit: 'fill', onDone: null };
function ipkPreview() {
  const t = customTile(ipk.sel.emoji, ipk.sel.img) || '<span class="ico none" aria-hidden="true">Site</span>';
  const g = glyphOf(ipk.sel.emoji);
  const what = ipk.sel.img ? 'Your image' : g ? `${GLYPH.get(g.key)[2].split(' ')[0]} · ${TILE_NAMES[g.c]}` : ipk.sel.emoji ? 'Emoji' : 'The site’s own icon';
  $('#ipkPrev').innerHTML = t; $('#ipkWhat').textContent = what;
  $$('#ipk [data-g]').forEach(b => b.setAttribute('aria-pressed', String(!!g && b.dataset.g === g.key)));
  $$('#ipk [data-e]').forEach(b => b.setAttribute('aria-pressed', String(!ipk.sel.img && b.dataset.e === ipk.sel.emoji)));
}
function ipkGlyphList() {
  const words = ipk.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = GLYPHS.filter(g => words.every(w => g[2].split(' ').some(x => x.startsWith(w)) || g[1].toLowerCase().includes(w)));
  const full = Object.keys(DRAWN).filter(k => words.every(w => DRAWN_WORDS[k].split(' ').some(x => x.startsWith(w))));
  if (!hits.length && !full.length) return '<p class="hint c">No icons match. Try another word, or look in Emoji.</p>';
  const cats = [...new Set(hits.map(g => g[1]))];
  return (full.length ? `<h3>Full color</h3><div class="ipk-grid">${full.map(k => `<button type="button" class="ipk-d" data-e="§${k}" aria-label="${esc(DRAWN_WORDS[k].split(' ')[0])}" aria-pressed="false">${DRAWN[k]}</button>`).join('')}</div>` : '') + cats.map(c => `<h3>${esc(c)}</h3><div class="ipk-grid">${hits.filter(g => g[1] === c).map(g => `<button type="button" class="ipk-g" data-g="${g[0]}" aria-label="${esc(g[2].split(' ')[0])}" aria-pressed="false">${glyphSVG(g[0])}</button>`).join('')}</div>`).join('');
}
function ipkTint() {
  const body = $('#ipkBody'); if (!body) return;
  body.style.setProperty('--tc', TILE_COLORS[ipk.color]); body.style.setProperty('--tf', ipk.color === WHITE_TILE ? '#1f2937' : '#fff');
  $$('#ipk [data-tc]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.tc === ipk.color)));
}
function ipkBody() {
  const body = $('#ipkBody');
  $$('#ipk [data-tab]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === ipk.tab)));
  if (ipk.tab === 'icons') {
    body.innerHTML = `<div class="ipk-sticky"><input type="search" id="ipkQ" class="ipk-q" placeholder="Search: movie, bank, pool, server…" value="${esc(ipk.q)}" autocomplete="off" autocapitalize="none" aria-label="Search icons">
      <div class="ipk-colors" role="group" aria-label="Tile color">${TILE_COLORS.map((c, i) => `<button type="button" data-tc="${i}" style="background:${c}" aria-label="${TILE_NAMES[i]}" aria-pressed="false"></button>`).join('')}</div></div>
      <div id="ipkList">${ipkGlyphList()}</div>`;
    ipkTint();
    $('#ipkQ').addEventListener('input', e => { ipk.q = e.target.value; $('#ipkList').innerHTML = ipkGlyphList(); ipkPreview(); });
  } else if (ipk.tab === 'emoji') {
    const typed = !ipk.sel.img && ipk.sel.emoji && !/^§/.test(ipk.sel.emoji) ? ipk.sel.emoji : '';
    body.innerHTML = `<input id="ipkE" class="ipk-q" placeholder="Or type any emoji from the keyboard" value="${esc(typed)}" maxlength="16" autocomplete="off" aria-label="Type an emoji">
      ${EMOJI_CATS.map(([c, list]) => `<h3>${esc(c)}</h3><div class="ipk-grid">${list.map(e => `<button type="button" data-e="${esc(e)}" aria-label="${esc(e)}" aria-pressed="false">${e}</button>`).join('')}</div>`).join('')}`;
    $('#ipkE').addEventListener('input', e => { const v = e.target.value.trim(); ipk.sel = { emoji: clampStr(v, 16), img: '' }; ipkPreview(); });
  } else {
    const canPaste = !!(navigator.clipboard && navigator.clipboard.read);
    body.innerHTML = `<div class="ipk-up">
      <div class="ipk-upbtns"><button type="button" class="btn" data-ipk="file">Choose a photo or file</button>${canPaste ? '<button type="button" class="btn" data-ipk="paste">Paste an image</button>' : ''}</div>
      <input type="file" id="ipkFile" accept="image/*" hidden>
      <div class="seg" id="ipkFit"${ipk.src ? '' : ' hidden'}><button type="button" class="chip" data-fit="fill" aria-pressed="${ipk.fit === 'fill'}">Fill the square</button><button type="button" class="chip" data-fit="fit" aria-pressed="${ipk.fit === 'fit'}">Fit it all in</button></div>
      <div class="dlg-err" id="ipkErr" role="alert"></div>
      <p class="hint">Square pictures look best. To use a logo from a web page: in Safari, press and hold it, tap Copy, then come back and tap Paste an image.</p>
      <p class="hint">It’s shrunk to icon size and shows on all your signed-in devices.</p></div>`;
    $('#ipkFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) ipkUseBlob(f); });
  }
  ipkPreview();
}
async function ipkUseBlob(blob) {
  const err = $('#ipkErr'); if (err) err.textContent = '';
  try {
    if (!/^image\//.test(blob.type || 'image/')) throw new Error('That isn’t an image.');
    if (blob.size > 30e6) throw new Error('That image is too big. Pick a smaller one.');
    ipk.src = await loadImage(blob);
    ipk.sel = { emoji: '', img: squareIcon(ipk.src, ipk.fit) };
    const fitEl = $('#ipkFit'); if (fitEl) fitEl.hidden = false;
    ipkPreview();
  } catch (ex) { if ($('#ipkErr')) $('#ipkErr').textContent = ex.message || 'Couldn’t use that image.'; }
}
async function ipkPaste() {
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) { const t = it.types.find(x => /^image\//.test(x)); if (t) { await ipkUseBlob(await it.getType(t)); return; } }
    $('#ipkErr').textContent = 'The clipboard doesn’t hold an image. Copy one first (press and hold it, then Copy).';
  } catch { $('#ipkErr').textContent = 'Couldn’t read the clipboard. Use Choose a photo or file instead.'; }
}
function openIconPicker(cur, onDone) {
  const d = $('#ipk'), g = glyphOf(cur.emoji);
  ipk.sel = { emoji: cur.img ? '' : str(cur.emoji), img: okImg(cur.img) ? cur.img : '' }; ipk.onDone = onDone; ipk.src = null; ipk.q = '';
  ipk.tab = ipk.sel.img ? 'image' : ipk.sel.emoji && !g && !drawnOf(ipk.sel.emoji) ? 'emoji' : 'icons';
  if (g) ipk.color = g.c;
  d.innerHTML = `<div class="ipk">
    <div class="ipk-top"><span id="ipkPrev"></span><div class="grow"><b>Choose an icon</b><span class="muted" id="ipkWhat"></span></div><button type="button" class="btn primary" data-ipk="done">Done</button></div>
    <div class="seg ipk-tabs" role="group" aria-label="Kind of icon"><button type="button" class="chip" data-tab="icons">Icons</button><button type="button" class="chip" data-tab="emoji">Emoji</button><button type="button" class="chip" data-tab="image">Upload</button></div>
    <div class="ipk-body" id="ipkBody"></div>
    <div class="ipk-foot"><button type="button" class="btn small ghost" data-ipk="site">Use the site’s own icon</button><span class="spacer"></span><button type="button" class="btn small ghost" data-ipk="cancel">Cancel</button></div></div>`;
  ipkBody();
  d.showModal();
}
$('#ipk').addEventListener('click', e => {
  const d = $('#ipk');
  if (e.target === d) { d.close(); return; }   /* tap outside: cancel */
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { ipk.tab = t.dataset.tab; ipkBody(); $('#ipkBody').scrollTop = 0; return; }
  if (t.dataset.tc) { ipk.color = +t.dataset.tc; ipkTint(); const g = glyphOf(ipk.sel.emoji); if (g) ipk.sel.emoji = `§${g.key}.${ipk.color}`; ipkPreview(); return; }
  if (t.dataset.g) { ipk.sel = { emoji: `§${t.dataset.g}.${ipk.color}`, img: '' }; ipkPreview(); return; }
  if (t.dataset.e) { ipk.sel = { emoji: t.dataset.e, img: '' }; const box = $('#ipkE'); if (box) box.value = t.dataset.e; ipkPreview(); return; }
  if (t.dataset.fit) { ipk.fit = t.dataset.fit; $$('#ipk [data-fit]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); if (ipk.src) { try { ipk.sel = { emoji: '', img: squareIcon(ipk.src, ipk.fit) }; } catch (ex) { $('#ipkErr').textContent = ex.message; } ipkPreview(); } return; }
  const k = t.dataset.ipk;
  if (k === 'file') $('#ipkFile').click();
  else if (k === 'paste') ipkPaste();
  else if (k === 'cancel') d.close();
  else if (k === 'site') { ipk.sel = { emoji: '', img: '' }; d.close(); if (ipk.onDone) ipk.onDone(ipk.sel); }
  else if (k === 'done') { d.close(); if (ipk.onDone) ipk.onDone({ ...ipk.sel }); }
});


(async function init() {
  try { db = await openDB(DB_NAME); const raw = await idbGet(db, 'state'); if (raw) state = normState(JSON.parse(raw)); }
  catch (e) { console.error(e); toast('This browser isn’t allowing storage, so links won’t be kept.'); }
  Sync.onChange(() => { renderIfSafe(); setTimeout(moveLocalToPlanner, 0); });
  ensureBuiltins(); applyTheme(); render();
  relWarm().then(c => { if (c) renderIfSafe(); });
  Sync.start({ db, key: 'sync', model: syncModel }).catch(e => console.error(e));
})();
